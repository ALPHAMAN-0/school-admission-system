# School Admission System
#
#   docker compose up --build          -> PostgreSQL + backend (:8080) + frontend (:3000)
#   docker compose --profile test run --rm backend-tests
#   docker compose --profile test run --rm frontend-tests
#   docker compose --profile multi up --build   -> also a 2nd backend on :8081 (same DB)
#
# Every value below can be overridden with an environment variable or a .env file
# (see .env.example). Data lives in the named volume "pgdata", so it survives
# `docker compose down` + `docker compose up` (only `down -v` deletes it).

name: school-admission

x-backend-environment: &backend-environment
  ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-school_admission};Username=${POSTGRES_USER:-admission};Password=${POSTGRES_PASSWORD:-admission_local_only};Maximum Pool Size=40"
  HOLD_DURATION_SECONDS: ${HOLD_DURATION_SECONDS:-600}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-school_admission}
      POSTGRES_USER: ${POSTGRES_USER:-admission}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admission_local_only}
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: runtime
    environment: *backend-environment
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      target: runtime
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Bonus: a second backend process on another port, sharing the same database.
  backend-2:
    profiles: ["multi"]
    build:
      context: ./backend
      target: runtime
    environment: *backend-environment
    ports:
      - "${BACKEND_2_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Backend test suite (real PostgreSQL; each test class creates and drops its own database).
  backend-tests:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      TEST_DB_CONNECTION: "Host=db;Port=5432;Database=postgres;Username=${POSTGRES_USER:-admission};Password=${POSTGRES_PASSWORD:-admission_local_only}"
    depends_on:
      db:
        condition: service_healthy

  # Frontend test suite (Vitest + Testing Library, no browser or backend needed).
  frontend-tests:
    profiles: ["test"]
    build:
      context: ./frontend
      target: test

volumes:
  pgdata:
